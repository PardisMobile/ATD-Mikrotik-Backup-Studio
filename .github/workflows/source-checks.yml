name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: Check PHP syntax
        run: php -l server-deployment/send-backup.php
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n server-deployment/install-server.sh
