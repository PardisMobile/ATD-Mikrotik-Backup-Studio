name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: Check PHP syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("windows-client/Generate-MikroTik-Backup.ps1").read_text(encoding="utf-8")
          marker = "$php = @'"
          start = source.index(marker) + len(marker)
          start = source.index("\n", start) + 1
          end = source.index("\n'@", start)
          php = source[start:end].lstrip()
          Path("/tmp/atd-generated-panel-lint.php").write_text(php, encoding="utf-8")
          PY
          php -l server-deployment/send-backup.php
          php -l /tmp/atd-generated-panel-lint.php
      - name: Check JavaScript and CSS syntax
        run: |
          node --check server-deployment/panel.js
          python3 -m pip install --quiet tinycss2
          python3 - <<'PY'
          from pathlib import Path
          import tinycss2
          path = Path("server-deployment/panel.css")
          css = path.read_text(encoding="utf-8")
          rules = tinycss2.parse_stylesheet(css, skip_comments=True, skip_whitespace=True)
          errors = [item for item in rules if item.type == "error"]
          if errors:
              for error in errors:
                  print(f"{path}:{error.source_line}:{error.source_column}: {error.message}")
              raise SystemExit(1)
          print("JavaScript syntax and CSS stylesheet parsing passed.")
          PY
      - name: Verify canonical assets and generated bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path("windows-client/Generate-MikroTik-Backup.ps1").read_text(encoding="utf-8")
          def here_string(name):
              marker = "$" + name + " = @'"
              start = source.index(marker) + len(marker)
              start = source.index("\n", start) + 1
              end = source.index("\n'@", start)
              return source[start:end].rstrip("\r\n")
          for name, path in (("php", "server-deployment/send-backup.php"),
                             ("css", "server-deployment/panel.css"),
                             ("js", "server-deployment/panel.js")):
              embedded = here_string(name)
              canonical = Path(path).read_text(encoding="utf-8").rstrip("\r\n")
              if embedded != canonical:
                  raise SystemExit(f"Embedded {name} template differs from canonical {path}")
          installer = here_string("installServer")
          for key, value in {
              "__PHP_SHA256__": "0" * 64,
              "__CSS_SHA256__": "1" * 64,
              "__JS_SHA256__": "2" * 64,
              "__CONFIG_B64__": "PD9waHA7",
          }.items():
              installer = installer.replace(key, value)
          path = Path("/tmp/atd-generated-bootstrap.sh")
          path.write_text(installer, encoding="utf-8")
          subprocess.run(["bash", "-n", str(path)], check=True)
          if "send-backup.php panel.css panel.js" in installer:
              raise SystemExit("Bootstrap must not require separate panel files from the user")
          generator = source
          runtime = Path("server-deployment/install-standalone.sh").read_text(encoding="utf-8")
          router_start = source.index("$routerScript = @\"")
          router_end = source.index("\n\"@", router_start)
          router_script = source[router_start:router_end]
          if "/tool fetch" not in source or "X-Backup-Token" not in source or "/send-backup.php" not in source:
              raise SystemExit("Generated RouterOS script must notify the authenticated panel after SFTP")
          if "api.telegram.org" in router_script or "telegramOK" in router_script:
              raise SystemExit("RouterOS must never call Telegram directly")
          php = Path("server-deployment/send-backup.php").read_text(encoding="utf-8")
          if "--scan-backups" in php or "--worker" in php or "telegram-scan-started-at" in php:
              raise SystemExit("PHP application must not contain a background worker/scanner mode")
          if "function send_telegram_file(" not in php or "STABILITY_CHECKS = 2" not in php:
              raise SystemExit("Panel PHP must check file-size stability before sending")
          runtime = Path("server-deployment/install-standalone.sh").read_text(encoding="utf-8")
          updater = Path("server-deployment/update-standalone.sh").read_text(encoding="utf-8")
          for script in (runtime, updater):
              if "cat > /etc/systemd/system/atd-mikrotik-backup-telegram-scan.timer" in script or "OnUnitActiveSec=" in script:
                  raise SystemExit("Installer/updater must not create a Telegram scan timer")
          if "systemctl disable --now" not in runtime or "systemctl disable --now" not in updater:
              raise SystemExit("Installer and updater must remove obsolete worker/timer units")
          config_start = source.index("$configPhp = @\"")
          config_end = source.index("\n\"@", config_start)
          generated_config = source[config_start:config_end]
          if "RELAY_TOKEN" in generated_config:
              raise SystemExit("New private configs must not depend on the legacy RouterOS relay token")
          if "$cleanupCondition = '($backupOK = true) && ($sftpOK = true)'" not in source:
              raise SystemExit("Local cleanup must depend only on successful backup and SFTP")
          if "Keep local file? [Y/N]" not in source or "$deleteAfterUpload = $keepLocal -match" not in source:
              raise SystemExit("User-selectable local backup retention must remain in the generator")
          if "const PUBLIC_PORT = $publicPort;" not in generator:
              raise SystemExit("Private config must persist the selected public port")
          if "PUBLIC_PORT=$(php -r 'require $argv[1]; echo PUBLIC_PORT;'" not in runtime:
              raise SystemExit("Server installer must use the configured public port")
          if "session.save_path=/var/lib/atd-mikrotik-backup-studio/sessions" not in runtime:
              raise SystemExit("PHP session path must be writable under the service sandbox")
          if 'echo "URL: https://$IP:$PUBLIC_PORT/send-backup.php"' not in runtime:
              raise SystemExit("Installer must print the actual panel endpoint")
          config = Path("/tmp/atd-test-config.php")
          config.write_text("<?php\nconst PUBLIC_PORT = 24443;\n", encoding="utf-8")
          port = subprocess.check_output(
              ["php", "-r", "require $argv[1]; echo PUBLIC_PORT;", str(config)],
              text=True
          ).strip()
          if port != "24443":
              raise SystemExit(f"PHP public-port extraction failed: {port!r}")
          print("Canonical assets match; bootstrap syntax, port extraction, URL and session invariants are valid.")
          PY
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and updater syntax
        run: |
          bash -n server-deployment/install-standalone.sh
          bash -n server-deployment/update-standalone.sh

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows generator without executing prompts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'windows-client/Generate-MikroTik-Backup.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Line {0}, column {1}: {2} [token: {3}]" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
            exit 1
          }
          Write-Host 'PowerShell generator parsed successfully.'
