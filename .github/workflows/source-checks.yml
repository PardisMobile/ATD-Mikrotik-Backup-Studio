name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: Check canonical PHP syntax
        run: |
          php -l server-deployment/send-backup.php
      - name: Check JavaScript and CSS syntax
        run: |
          node --check server-deployment/panel.js
          python3 -m pip install --quiet tinycss2
          python3 - <<'PY'
          from pathlib import Path
          import tinycss2
          path = Path("server-deployment/panel.css")
          css = path.read_text(encoding="utf-8")
          rules = tinycss2.parse_stylesheet(css, skip_comments=True, skip_whitespace=True)
          errors = [item for item in rules if item.type == "error"]
          if errors:
              for error in errors:
                  print(f"{path}:{error.source_line}:{error.source_column}: {error.message}")
              raise SystemExit(1)
          print("JavaScript syntax and CSS stylesheet parsing passed.")
          PY
      - name: Verify canonical assets and generated bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path("windows-client/Generate-MikroTik-Backup.ps1").read_text(encoding="utf-8")
          def here_string(name):
              marker = "$" + name + " = @'"
              start = source.index(marker) + len(marker)
              start = source.index("\n", start) + 1
              end = source.index("\n'@", start)
              return source[start:end].rstrip("\r\n")
          for name in ("php", "css", "js", "cronHelper"):
              if f"${name} = @'" in source:
                  raise SystemExit(f"Generator must not embed the versioned {name} application asset")
          if "$configB64 = [Convert]::ToBase64String" not in source:
              raise SystemExit("Generator must package only customer-specific private configuration")
          installer = here_string("installServer")
          installer = installer.replace("__CONFIG_B64__", "PD9waHA7")
          path = Path("/tmp/atd-generated-bootstrap.sh")
          path.write_text(installer, encoding="utf-8")
          subprocess.run(["bash", "-n", str(path)], check=True)
          if "send-backup.php panel.css panel.js" in installer:
              raise SystemExit("Bootstrap must not require separate panel files from the user")
          if "api.github.com/repos/PardisMobile/ATD-Mikrotik-Backup-Studio/commits/main" not in installer:
              raise SystemExit("Bootstrap must resolve one immutable source commit before downloading assets")
          if "ATD_SOURCE_COMMIT=\"$COMMIT\" bash \"$TMP/install-standalone.sh\" \"$TMP\"" not in installer:
              raise SystemExit("Bootstrap must pass the resolved commit to the runtime installer")
          if 'raw.githubusercontent.com/PardisMobile/ATD-Mikrotik-Backup-Studio/main/server-deployment' in installer:
              raise SystemExit("Bootstrap must not fetch individually mutable main-branch assets")
          generator = source
          runtime = Path("server-deployment/install-standalone.sh").read_text(encoding="utf-8")
          router_start = source.index("$routerScript = @\"")
          router_end = source.index("\n\"@", router_start)
          router_script = source[router_start:router_end]
          if 'url=("https://" . $sftpHost' in router_script or "X-Backup-Token" in router_script or "/send-backup.php" in router_script:
              raise SystemExit("RouterOS script must retain the SFTP-only workflow and must not call the panel")
          if "api.telegram.org" in router_script or "telegramOK" in router_script:
              raise SystemExit("RouterOS must never call Telegram directly")
          helper = Path("server-deployment/set-system-timezone.sh").read_text(encoding="utf-8")
          if "timedatectl set-timezone" not in helper or "realpath -e" not in helper:
              raise SystemExit("System time-zone helper must validate the installed zone and use timedatectl.")
          if "atd-mikrotik-backup-set-timezone" not in Path("server-deployment/install-standalone.sh").read_text(encoding="utf-8"):
              raise SystemExit("Installer must install the restricted system time-zone helper.")
          if "set-system-timezone.sh" not in Path("server-deployment/update-standalone.sh").read_text(encoding="utf-8"):
              raise SystemExit("Updater must stage the system time-zone helper.")
          php = Path("server-deployment/send-backup.php").read_text(encoding="utf-8")
          if 'data-panel-tab="dashboard"' not in php or "serverClockTop" not in php:
              raise SystemExit("Panel must include section navigation and the top-bar live clock.")
          if "$_GET['sort']" not in php or "$sortHeader('size'" not in php:
              raise SystemExit("Panel must provide server-side sorting controls.")
          if "PANEL_HOSTNAME" not in Path("windows-client/Generate-MikroTik-Backup.ps1").read_text(encoding="utf-8"):
              raise SystemExit("Windows generator must preserve the panel hostname in generated configuration.")
          if 'URL (hostname): https://$PANEL_HOSTNAME:$PUBLIC_PORT/send-backup.php' not in Path("server-deployment/install-standalone.sh").read_text(encoding="utf-8"):
              raise SystemExit("Installer must print the hostname-based panel URL when configured.")
          if "check_update" not in php or "installed-source-commit" not in php:
              raise SystemExit("Panel must expose a read-only GitHub update check and installed-version marker.")
          if "commits/main.atom" not in php or "network/TLS error" not in php:
              raise SystemExit("Update checker must use a fallback endpoint and show actionable connectivity diagnostics.")
          if "SYSTEM_TIMEZONE_HELPER_MISSING: run sudo atd-mikrotik-backup-update" not in php:
              raise SystemExit("Missing timezone helper must provide the supported repair command.")
          if "update-panel{margin-bottom:26px}" not in Path("server-deployment/panel.css").read_text(encoding="utf-8"):
              raise SystemExit("Settings panels must have clear vertical spacing.")
          if 'id="checkUpdates"' not in php or "checkUpdateStatus" not in php:
              raise SystemExit("Panel must display an update-check control and status.")
          if "in_array('--scan-backups', $argv ?? [], true)" not in php or "function send_telegram_file(" not in php:
              raise SystemExit("PHP must provide the automatic CLI scanner and Telegram sender")
          if "STABILITY_CHECKS = 2" not in php:
              raise SystemExit("PHP must check file-size stability before sending")
          if "function latest_backup_name()" not in php or "send_telegram_file($latest, true)" not in php:
              raise SystemExit("The single Telegram connection test must send the newest existing backup file")
          if "sendMessage" in php or 'value="send"' in php:
              raise SystemExit("Do not add a text-only test or per-file send buttons")
          runtime = Path("server-deployment/install-standalone.sh").read_text(encoding="utf-8")
          updater = Path("server-deployment/update-standalone.sh").read_text(encoding="utf-8")
          snapshot = next((line for line in updater.splitlines() if line.startswith("for path in /usr/local/sbin/atd-mikrotik-backup-cron ")), "")
          timezone_sudoers = "/etc/sudoers.d/atd-panel-timezone"
          if timezone_sudoers not in snapshot:
              raise SystemExit("Updater rollback snapshot must include the exact Linux-timezone sudoers path")
          if "HOST_CRON_NOT_READY" not in runtime or "HOST_CRON_NOT_READY" not in updater:
              raise SystemExit("Installer and updater must require a pre-existing active and enabled host Cron service")
          for path, script in (("installer", runtime), ("updater", updater)):
              forbidden = ("systemctl enable --now cron.service", "systemctl enable --now crond.service", "apt-get install -y cron", "dnf install -y cronie", "yum install -y cronie")
              if any(command in script for command in forbidden):
                  raise SystemExit(f"{path} must not install, enable, or start the shared host Cron daemon")
          if timezone_sudoers not in runtime:
              raise SystemExit("Installer and updater must use the same Linux-timezone sudoers path")
          if 'raw.githubusercontent.com/PardisMobile/ATD-Mikrotik-Backup-Studio/main/server-deployment' in updater:
              raise SystemExit("Updater must fetch assets from one immutable commit snapshot")
          if "api.github.com/repos/PardisMobile/ATD-Mikrotik-Backup-Studio/commits/main" not in updater:
              raise SystemExit("Updater must resolve the immutable source commit before staging assets")
          if "No unrelated systemd service or timer is migrated, disabled, removed, or rewritten." not in updater:
              raise SystemExit("Updater must preserve all unrelated systemd services and timers")
          if "atd-mikrotik-backup-php.service" not in updater or 'NoNewPrivileges=false' not in runtime:
              raise SystemExit("Only the ATD PHP service may relax NoNewPrivileges for the restricted timezone helper")
          legacy_sudoers = "/etc/sudoers.d/atd-mikrotik-backup-panel-update"
          if legacy_sudoers not in snapshot or "Legacy ATD panel sudoers file contains unexpected rules" not in updater:
              raise SystemExit("Updater must snapshot and safely retire only the known legacy ATD panel sudo rule")
          if "/etc/systemd/system/atd-mikrotik-backup-php.service" not in snapshot:
              raise SystemExit("Updater rollback snapshot must include the exact ATD PHP service unit")
          if "ATD_SOURCE_COMMIT" not in runtime or "SOURCE_COMMIT" not in runtime:
              raise SystemExit("Runtime installer must use the bootstrap's pinned source commit for updater download")
          if 'BACKUP_DIR=$(sed -n "s/^const BACKUP_DIR' not in runtime or ' "$TLS/config.php"' not in runtime:
              raise SystemExit("Re-installs must derive BACKUP_DIR from the preserved private config")
          if 'mkdir -p "$APP" "$STATE/sessions" "$TLS"' not in runtime:
              raise SystemExit("Re-installs must not create a new package backup path before preserving config")
          for script in (runtime, updater):
              if "/etc/cron.d/atd-mikrotik-backup-telegram" not in script or "--scan-backups" not in script:
                  raise SystemExit("Installer/updater must install the dedicated ATD cron scan")
              if "/etc/cron.d/atd-mikrotik-backup-apply" not in script:
                  raise SystemExit("Installer/updater must install the root-owned schedule-apply Cron worker")
              if 'rm -f "$STATE/telegram-scan-started-at"' in script:
                  raise SystemExit("Installer/updater must preserve the Telegram scan baseline")
          for script in (runtime, updater):
              if "systemctl disable --now" in script or 'rm -f "/etc/systemd/system/' in script or "systemd-run" in script or "panel-update-worker" in script:
                  raise SystemExit("Installer/updater must not remove units or create a panel background Worker")
          js = Path("server-deployment/panel.js").read_text(encoding="utf-8")
          if "form.action||location.href" in js or "form.getAttribute('action')" not in js:
              raise SystemExit("AJAX form URLs must not use the shadowable form.action DOM property")
          if "sudo_command_allowed($timezoneHelper)" not in php or "sudo -n -l " not in php:
              raise SystemExit("Privileged helper readiness must be checked via the caller's sudo policy")
          cron_helper = Path("server-deployment/cron-helper.sh").read_text(encoding="utf-8")
          timezone_helper = Path("server-deployment/set-system-timezone.sh").read_text(encoding="utf-8")
          if 'state["_cron_timezone"]' not in cron_helper or 'state["_timezone"]' in cron_helper:
              raise SystemExit("Cron time zone must be stored independently from the Linux panel time zone")
          if "atd-mikrotik-backup-cron" in timezone_helper or "--apply" in timezone_helper:
              raise SystemExit("Changing Linux time zone must not rewrite the independent Cron schedule")
          config_start = source.index("$configPhp = @\"")
          config_end = source.index("\n\"@", config_start)
          generated_config = source[config_start:config_end]
          if "const BACKUP_SCHEDULE_TIMES = [$schedulePhp];" not in generated_config:
              raise SystemExit("Generated private config must persist the Windows-selected backup times")
          if "const TELEGRAM_DELAY_MINUTES = 2;" not in generated_config:
              raise SystemExit("Generated private config must define the default Telegram delay")
          if "const DEFAULT_CRON_TIMEZONE = 'UTC';" not in generated_config:
              raise SystemExit("New installs must default Cron time zone independently to UTC")
          if "TRIGGER_TOKEN" in generated_config or "RELAY_TOKEN" in generated_config:
              raise SystemExit("New private configs must not depend on RouterOS callback tokens")
          if "const TELEGRAM_BOT_TOKEN = '';" not in generated_config or "const TELEGRAM_CHAT_ID = '';" not in generated_config:
              raise SystemExit("Generator must leave Telegram credentials to the authenticated panel settings")
          if "Telegram bot token from @BotFather" in source or "Telegram destination Chat ID" in source:
              raise SystemExit("Windows generator must not prompt for Telegram bot token or Chat ID")
          if "$cleanupCondition = '($backupOK = true) && ($sftpOK = true)'" not in source:
              raise SystemExit("Local cleanup must depend only on successful backup and SFTP")
          if "Keep local file? [Y/N]" not in source or "$deleteAfterUpload = $keepLocal -match" not in source:
              raise SystemExit("User-selectable local backup retention must remain in the generator")
          if "const PUBLIC_PORT = $publicPort;" not in generator:
              raise SystemExit("Private config must persist the selected public port")
          if "PUBLIC_PORT=$(php -r 'require $argv[1]; echo PUBLIC_PORT;'" not in runtime:
              raise SystemExit("Server installer must use the configured public port")
          if "session.save_path=/var/lib/atd-mikrotik-backup-studio/sessions" not in runtime:
              raise SystemExit("PHP session path must be writable under the service sandbox")
          if 'echo "URL (IP): https://$IP:$PUBLIC_PORT/send-backup.php"' not in runtime:
              raise SystemExit("Installer must print the detected-IP panel endpoint")
          if 'echo "URL (hostname): https://$PANEL_HOSTNAME:$PUBLIC_PORT/send-backup.php"' not in runtime:
              raise SystemExit("Installer must print the configured hostname endpoint when available")
          config = Path("/tmp/atd-test-config.php")
          config.write_text("<?php\nconst PUBLIC_PORT = 24443;\n", encoding="utf-8")
          port = subprocess.check_output(
              ["php", "-r", "require $argv[1]; echo PUBLIC_PORT;", str(config)],
              text=True
          ).strip()
          if port != "24443":
              raise SystemExit(f"PHP public-port extraction failed: {port!r}")
          print("Canonical assets match; bootstrap syntax, port extraction, URL and session invariants are valid.")
          PY
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and updater syntax
        run: |
          bash -n server-deployment/install-standalone.sh
          bash -n server-deployment/update-standalone.sh
          bash -n server-deployment/set-system-timezone.sh
          bash -n server-deployment/uninstall-standalone.sh

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows generator without executing prompts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'windows-client/Generate-MikroTik-Backup.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Line {0}, column {1}: {2} [token: {3}]" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
            exit 1
          }
          Write-Host 'PowerShell generator parsed successfully.'
