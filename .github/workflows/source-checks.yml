name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: Check PHP syntax
        run: |
          php -l server-deployment/send-backup.php
          bash -n server-deployment/install-standalone.sh
          bash -n server-deployment/update-standalone.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path("windows-client/Generate-MikroTik-Backup.ps1").read_text(encoding="utf-8")
          start = source.index("$php = @'") + len("$php = @'")
          end = source.index("\n'@", start)
          php = source[start:end].lstrip()
          for key, value in {
              "__RELAY_TOKEN__": "test-relay-token",
              "__BOT_TOKEN__": "123456:test-bot-token",
              "__CHAT_ID__": "123456789",
              "__PANEL_PASSWORD_SALT__": "0123456789abcdef0123456789abcdef",
              "__PANEL_PASSWORD_HASH__": "0" * 64,
              "__BACKUP_DIR__": "/root/uploads",
              "__MAX_BYTES__": str(45 * 1024 * 1024),
          }.items():
              php = php.replace(key, value)
          Path("/tmp/atd-generated-panel-lint.php").write_text(php, encoding="utf-8")
          PY
          php -l /tmp/atd-generated-panel-lint.php
      - name: Verify canonical assets and generated bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          source = Path("windows-client/Generate-MikroTik-Backup.ps1").read_text(encoding="utf-8")
          def here_string(name):
              start = source.index(f"${name} = @'") + len(f"${name} = @'\\n")
              end = source.index("\\n'@", start)
              return source[start:end]
          for name, path in (("php", "server-deployment/send-backup.php"),
                             ("css", "server-deployment/panel.css"),
                             ("js", "server-deployment/panel.js")):
              embedded = here_string(name).rstrip("\\r\\n")
              canonical = Path(path).read_text(encoding="utf-8").rstrip("\\r\\n")
              if embedded != canonical:
                  raise SystemExit(f"Embedded {name} template differs from canonical {path}")
          installer = here_string("installServer")
          for key, value in {
              "__PHP_SHA256__": "0" * 64,
              "__CSS_SHA256__": "1" * 64,
              "__JS_SHA256__": "2" * 64,
              "__CONFIG_B64__": "PD9waHA7",
          }.items():
              installer = installer.replace(key, value)
          path = Path("/tmp/atd-generated-bootstrap.sh")
          path.write_text(installer, encoding="utf-8")
          subprocess.run(["bash", "-n", str(path)], check=True)
          if "send-backup.php panel.css panel.js" in installer:
              raise SystemExit("Bootstrap must not require separate panel files from the user")
          print("Canonical PHP/CSS/JS templates match; generated bootstrap syntax is valid.")
          PY
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n server-deployment/install-standalone.sh
